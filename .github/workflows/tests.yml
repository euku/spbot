name: tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PYWIKIBOT_NO_USER_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same as the Toolforge job image
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests
